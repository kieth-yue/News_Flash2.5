name: HK News Monitor v2
on:
  schedule:
    # ===== 早市 session 06:00-11:00 HKT（UTC 前日 22:xx，週日至四）=====
    - cron: '7 22 * * 0-4'    # HKT 06:07
    - cron: '25 22 * * 0-4'   # HKT 06:25 備用
    - cron: '47 22 * * 0-4'   # HKT 06:47 最後備用
    # ===== 午市 session 11:00-15:00 HKT（UTC 03:xx，週一至五）=====
    - cron: '7 3 * * 1-5'     # HKT 11:07
    - cron: '25 3 * * 1-5'    # HKT 11:25 備用
    - cron: '47 3 * * 1-5'    # HKT 11:47 最後備用
    # ===== 晚間 session 21:30-03:00 HKT（UTC 13-14:xx，週一至五）=====
    - cron: '37 13 * * 1-5'   # HKT 21:37
    - cron: '55 13 * * 1-5'   # HKT 21:55 備用
    - cron: '13 14 * * 1-5'   # HKT 22:13 最後備用
  workflow_dispatch:
    inputs:
      force_run:
        description: '強制運行（忽略週末同時間窗口，即時跑一次測試用）'
        required: false
        type: boolean
        default: false
jobs:
  news_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: hk-news-monitor-v2
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore push cache
        uses: actions/cache@v4
        with:
          path: push_cache.json
          key: hk-news-v2-${{ github.run_id }}
          restore-keys: |
            hk-news-v2-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml>=6.0 google-genai>=1.0.0 requests>=2.32.0 opencc-python-reimplemented>=0.1.7
      - name: Run news monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          HK_NEWS_PROMPT_MACRO: ${{ vars.HK_NEWS_PROMPT_MACRO }}
          HK_NEWS_PROMPT_STOCK: ${{ vars.HK_NEWS_PROMPT_STOCK }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
        run: python main.py
