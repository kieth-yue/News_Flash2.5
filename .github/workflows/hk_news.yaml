name: HK News Monitor v2
on:
  schedule:
    - cron: '2 23 * * 0-4'
    - cron: '2 3 * * 1-5'
    - cron: '32 13 * * 1-5'
  workflow_dispatch:
    inputs:
      force_run:
        description: '強制運行（忽略週末同時間窗口，即時跑一次測試用）'
        required: false
        type: boolean
        default: false
jobs:
  news_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: hk-news-monitor-v2
      cancel-in-progress: false   # ← 改呢度，唔好取消緊運行嘅 job
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore push cache
        uses: actions/cache@v4
        with:
          path: push_cache.json
          key: hk-news-v2-${{ github.run_id }}
          restore-keys: |
            hk-news-v2-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml>=6.0 google-genai>=1.0.0 requests>=2.32.0
      - name: Run news monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          HK_NEWS_PROMPT_MACRO: ${{ vars.HK_NEWS_PROMPT_MACRO }}
          HK_NEWS_PROMPT_STOCK: ${{ vars.HK_NEWS_PROMPT_STOCK }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
        run: python main.py
