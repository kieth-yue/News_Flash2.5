name: HK News Monitor v2
on:
  schedule:
    # 🌅 早市：HKT 06:08 → UTC 22:08（前日）週日至四 = 週一至五早市 HKT
    - cron: '8 22 * * 0-4'
    
    # ☀️ 午市：HKT 11:02 → UTC 03:02 週一至五 HKT
    - cron: '2 3 * * 1-5'
    # ☀️ 午市 (備用)：HKT 11:20 → UTC 03:20 
    - cron: '20 3 * * 1-5'
    
    # 🌙 晚間：HKT 21:38 → UTC 13:38 週日至五 (對應香港星期日晚至五晚，完美兼顧開市準備與週末補漏)
    - cron: '38 13 * * 0-5'
    # 🌙 晚間 (備用)：HKT 21:55 → UTC 13:55 週日至五
    - cron: '55 13 * * 0-5'
    
  workflow_dispatch:
    inputs:
      force_run:
        description: '強制運行（忽略週末同時間窗口，即時跑一次測試用）'
        required: false
        type: boolean
        default: false

jobs:
  news_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: hk-news-monitor-v2
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Restore push cache
        uses: actions/cache@v4
        with:
          path: push_cache.json
          key: hk-news-v2-${{ github.run_id }}
          restore-keys: |
            hk-news-v2-
            
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml>=6.0 google-genai>=1.0.0 requests>=2.32.0 opencc-python-reimplemented>=0.1.7
          
      - name: Run news monitor
        env:
          PYTHONUNBUFFERED: 1     # 🚨 強制 Python 即時輸出日誌，不作緩衝保留
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          HK_NEWS_PROMPT_MACRO: ${{ vars.HK_NEWS_PROMPT_MACRO }}
          HK_NEWS_PROMPT_STOCK: ${{ vars.HK_NEWS_PROMPT_STOCK }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
        run: python -u main.py    # 🚨 -u 參數，啟動 Unbuffered mode
