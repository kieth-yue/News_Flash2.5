name: HK News Monitor v2
on:
  schedule:
    # HKT 06:02 → UTC 22:02（前日）週日至四 = 週一至五 HKT
    - cron: '2 22 * * 0-4'
    # HKT 06:20 → UTC 22:20（前日）備用，防止主 cron 漏跑
    - cron: '20 22 * * 0-4'
    # HKT 11:02 → UTC 03:02 週一至五
    - cron: '2 3 * * 1-5'
    # HKT 11:20 → UTC 03:20 備用
    - cron: '20 3 * * 1-5'
    # HKT 21:32 → UTC 13:32 週一至五
    - cron: '32 13 * * 1-5'
    # HKT 21:50 → UTC 13:50 備用
    - cron: '50 13 * * 1-5'
  workflow_dispatch:
    inputs:
      force_run:
        description: '強制運行（忽略週末同時間窗口，即時跑一次測試用）'
        required: false
        type: boolean
        default: false
jobs:
  news_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: hk-news-monitor-v2
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore push cache
        uses: actions/cache@v4
        with:
          path: push_cache.json
          key: hk-news-v2-${{ github.run_id }}
          restore-keys: |
            hk-news-v2-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml>=6.0 google-genai>=1.0.0 requests>=2.32.0 opencc-python-reimplemented>=0.1.7
      - name: Run news monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          HK_NEWS_PROMPT_MACRO: ${{ vars.HK_NEWS_PROMPT_MACRO }}
          HK_NEWS_PROMPT_STOCK: ${{ vars.HK_NEWS_PROMPT_STOCK }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
        run: python main.py
